<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" width="340" height="88"
     role="img" aria-label="Nucleus">
  <title>Nucleus</title>

  <style>
    /* The mark keeps its colour in both themes; only the wordmark and the
       fainter orbit need to flip, so a reader on a dark README sees contrast
       rather than a smudge. */
    .word  { fill: #0f172a; }
    .sub   { fill: #64748b; }
    .orbit { stroke: #5b5bd6; }
    @media (prefers-color-scheme: dark) {
      .word  { fill: #f1f5f9; }
      .sub   { fill: #94a3b8; }
      .orbit { stroke: #8b8bf0; }
    }
  </style>

  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c7cf5"/>
      <stop offset="55%"  stop-color="#5b5bd6"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5b5bd6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b5bd6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── mark: a nucleus with two crossing orbits ── -->
  <g transform="translate(44 44)">
    <circle r="34" fill="url(#glow)"/>

    <!-- Orbits are ellipses rotated against each other, which reads as depth
         without needing a 3-D projection. -->
    <ellipse rx="30" ry="12.5" fill="none" class="orbit" stroke-width="2.5"
             opacity="0.9" transform="rotate(-28)"/>
    <ellipse rx="30" ry="12.5" fill="none" class="orbit" stroke-width="2.5"
             opacity="0.55" transform="rotate(52)"/>

    <!-- Core, drawn after the orbits so they pass behind it. -->
    <circle r="11.5" fill="url(#core)"/>
    <circle r="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Electrons, sitting on each orbit's major axis. -->
    <circle cx="26.5" cy="-14.1" r="3.6" fill="#22d3ee"/>
    <circle cx="-18.5" cy="23.6" r="3.2" fill="#a78bfa"/>
    <circle cx="-26.5" cy="14.1" r="2.6" fill="#5b5bd6" opacity="0.75"/>
  </g>

  <!-- ── wordmark ── -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text class="word" x="94" y="47" font-size="34" font-weight="650" letter-spacing="-0.8">Nucleus</text>
    <text class="sub"  x="96" y="68" font-size="11.5" font-weight="500" letter-spacing="2.6">APPLICATION TEMPLATE</text>
  </g>
</svg>
