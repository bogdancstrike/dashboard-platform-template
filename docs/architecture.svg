<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980"
     font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
     role="img" aria-label="Nucleus platform architecture">
  <title>Nucleus — platform architecture</title>
  <desc>
    Request flow from the browser through nginx to the Flask API, with Keycloak
    for identity and PostgreSQL and Redis for data. Numbered steps 1 to 9 trace
    a first page load, a sign-in and an authenticated API call.
  </desc>

  <style>
    .bg      { fill: #f1f5f9; }
    .zone    { fill: #ffffff; stroke: #cbd5e1; }
    .zone-lb { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
    .card    { fill: #ffffff; stroke: #e2e8f0; }
    .title   { fill: #0f172a; font-size: 28px; font-weight: 700; }
    .sub     { fill: #64748b; font-size: 14px; }
    .h       { fill: #0f172a; font-size: 16px; font-weight: 650; }
    .h-sm    { fill: #0f172a; font-size: 13.5px; font-weight: 600; }
    .t       { fill: #475569; font-size: 12.5px; }
    .t-dim   { fill: #64748b; font-size: 11.5px; }
    .mono    { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #475569; }
    .flow    { stroke: #5b5bd6; stroke-width: 2; fill: none; }
    .flow-2  { stroke: #0891b2; stroke-width: 2; fill: none; }
    .flow-3  { stroke: #ca8a04; stroke-width: 2; fill: none; }
    .flow-op { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .lbl     { fill: #475569; font-size: 11.5px; font-weight: 500; }
    .badge-t { fill: #ffffff; font-size: 12px; font-weight: 700; }

    @media (prefers-color-scheme: dark) {
      .bg      { fill: #020617; }
      .zone    { fill: #0f172a; stroke: #334155; }
      .zone-lb { fill: #94a3b8; }
      .card    { fill: #1e293b; stroke: #334155; }
      .title   { fill: #f1f5f9; }
      .sub     { fill: #94a3b8; }
      .h       { fill: #f1f5f9; }
      .h-sm    { fill: #f1f5f9; }
      .t       { fill: #cbd5e1; }
      .t-dim   { fill: #94a3b8; }
      .mono    { fill: #cbd5e1; }
      .lbl     { fill: #cbd5e1; }
      .flow    { stroke: #8b8bf0; }
    }
  </style>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b5bd6"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ca8a04"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect class="bg" width="1440" height="980"/>

  <!-- ── header ───────────────────────────────────────────────────────── -->
  <g transform="translate(48 34)">
    <g transform="translate(14 18)">
      <ellipse rx="17" ry="7" fill="none" stroke="#5b5bd6" stroke-width="2.4" transform="rotate(-28)"/>
      <ellipse rx="17" ry="7" fill="none" stroke="#5b5bd6" stroke-width="2.4" opacity="0.5" transform="rotate(52)"/>
      <circle r="7" fill="#5b5bd6"/>
    </g>
    <text class="title" x="44" y="18">Nucleus</text>
    <text class="sub" x="44" y="40">Enterprise application template — request path, identity flow and data plane</text>
  </g>

  <!-- ══ CLIENT ═══════════════════════════════════════════════════════ -->
  <rect class="zone" x="40" y="128" width="292" height="286" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="60" y="154">CLIENT</text>

  <rect class="card" x="62" y="170" width="248" height="222" rx="8"/>
  <rect x="62" y="170" width="248" height="4" rx="2" fill="#5b5bd6"/>
  <text class="h" x="80" y="200">Browser</text>
  <text class="t" x="80" y="222">Single-page application</text>
  <line x1="80" y1="238" x2="292" y2="238" stroke="#e2e8f0"/>
  <text class="t-dim" x="80" y="260">React 18 · TypeScript · Ant Design 5</text>
  <text class="t-dim" x="80" y="280">ECharts · RAQB query builder · cmdk</text>
  <text class="t-dim" x="80" y="300">TanStack Query</text>
  <line x1="80" y1="316" x2="292" y2="316" stroke="#e2e8f0"/>
  <text class="t-dim" x="80" y="338">Tokens, realm and client id are</text>
  <text class="t-dim" x="80" y="356">fetched at startup — never compiled</text>
  <text class="t-dim" x="80" y="374">into the bundle</text>

  <!-- ══ EDGE ═════════════════════════════════════════════════════════ -->
  <rect class="zone" x="372" y="128" width="252" height="286" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="392" y="154">EDGE</text>

  <rect class="card" x="394" y="170" width="208" height="222" rx="8"/>
  <rect x="394" y="170" width="208" height="4" rx="2" fill="#16a34a"/>
  <text class="h" x="412" y="200">nginx</text>
  <text class="t" x="412" y="222">Static bundle + proxy</text>
  <line x1="412" y1="238" x2="584" y2="238" stroke="#e2e8f0"/>
  <text class="mono" x="412" y="260">/            → index.html</text>
  <text class="mono" x="412" y="280">/assets/     → immutable</text>
  <text class="mono" x="412" y="300">/platform/*  → api:5101</text>
  <line x1="412" y1="316" x2="584" y2="316" stroke="#e2e8f0"/>
  <text class="t-dim" x="412" y="338">One origin, so the browser</text>
  <text class="t-dim" x="412" y="356">never sends a preflight and</text>
  <text class="t-dim" x="412" y="374">deep links survive a paste</text>

  <!-- ══ IDENTITY ═════════════════════════════════════════════════════ -->
  <rect class="zone" x="1096" y="128" width="304" height="286" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="1116" y="154">IDENTITY</text>

  <rect class="card" x="1118" y="170" width="260" height="222" rx="8"/>
  <rect x="1118" y="170" width="260" height="4" rx="2" fill="#dc2626"/>
  <text class="h" x="1136" y="200">Keycloak</text>
  <text class="t" x="1136" y="222">Realm <tspan class="mono">template</tspan></text>
  <line x1="1136" y1="238" x2="1360" y2="238" stroke="#e2e8f0"/>
  <text class="t-dim" x="1136" y="260">Public URL — the browser is</text>
  <text class="t-dim" x="1136" y="278">redirected here, and the issuer</text>
  <text class="t-dim" x="1136" y="296">on the token must match it</text>
  <text class="t-dim" x="1136" y="320">Internal URL — signing keys are</text>
  <text class="t-dim" x="1136" y="338">fetched over the container network</text>
  <line x1="1136" y1="352" x2="1360" y2="352" stroke="#e2e8f0"/>
  <text class="t-dim" x="1136" y="374">5 roles · 5 demo users · JWKS</text>

  <!-- ══ APPLICATION ══════════════════════════════════════════════════ -->
  <rect class="zone" x="664" y="128" width="392" height="606" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="684" y="154">APPLICATION</text>

  <rect class="card" x="686" y="170" width="348" height="66" rx="8"/>
  <rect x="686" y="170" width="348" height="4" rx="2" fill="#5b5bd6"/>
  <text class="h" x="704" y="200">API — gunicorn + gevent</text>
  <text class="t-dim" x="704" y="222">Greenlets, with psycopg2 patched to yield</text>

  <!-- endpoint map -->
  <rect class="card" x="686" y="252" width="348" height="72" rx="8"/>
  <text class="h-sm" x="704" y="276">maps/endpoint.json</text>
  <text class="t-dim" x="704" y="296">The API surface. QF's router mounts every</text>
  <text class="t-dim" x="704" y="313">resource from it; verified at startup</text>

  <!-- handlers -->
  <rect class="card" x="686" y="340" width="348" height="62" rx="8"/>
  <text class="h-sm" x="704" y="364">src/api/ — handlers</text>
  <text class="mono" x="704" y="386">handler(app, operation, request, **params)</text>

  <!-- core -->
  <rect class="card" x="686" y="418" width="348" height="180" rx="8"/>
  <rect x="686" y="418" width="4" height="180" rx="2" fill="#0891b2"/>
  <text class="h-sm" x="708" y="442">src/core/ — the load-bearing layer</text>

  <rect x="708" y="456" width="94" height="26" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="t" x="722" y="473" font-size="11.5">auth · RBAC</text>
  <rect x="812" y="456" width="86" height="26" rx="13" fill="#ecfeff" stroke="#a5f3fc"/>
  <text class="t" x="826" y="473" font-size="11.5">query · SQL</text>
  <rect x="908" y="456" width="104" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t" x="922" y="473" font-size="11.5">rules · RAQB</text>

  <rect x="708" y="492" width="80" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t" x="722" y="509" font-size="11.5">audit</text>
  <rect x="798" y="492" width="80" height="26" rx="13" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t" x="812" y="509" font-size="11.5">cache</text>
  <rect x="888" y="492" width="124" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t" x="902" y="509" font-size="11.5">pagination · clock</text>

  <text class="t-dim" x="708" y="544">Filtering, sorting, faceting and search all</text>
  <text class="t-dim" x="708" y="562">compile to SQL — never to a filtered page</text>
  <text class="t-dim" x="708" y="580">Audit rows commit with the change they describe</text>

  <!-- models -->
  <rect class="card" x="686" y="614" width="348" height="62" rx="8"/>
  <text class="h-sm" x="704" y="638">src/models/ — SQLAlchemy 2</text>
  <text class="t-dim" x="704" y="658">49 tables · UUID keys · soft delete · JSONB</text>

  <!-- ══ DATA ═════════════════════════════════════════════════════════ -->
  <rect class="zone" x="1096" y="450" width="304" height="284" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="1116" y="476">DATA</text>

  <rect class="card" x="1118" y="492" width="260" height="106" rx="8"/>
  <rect x="1118" y="492" width="260" height="4" rx="2" fill="#0891b2"/>
  <text class="h" x="1136" y="522">PostgreSQL 18</text>
  <text class="t-dim" x="1136" y="544">50 tables · 499 indexes · 113 FKs</text>
  <text class="t-dim" x="1136" y="564">System of record</text>
  <text class="t-dim" x="1136" y="584">Every list query is answered here</text>

  <rect class="card" x="1118" y="614" width="260" height="100" rx="8"/>
  <rect x="1118" y="614" width="260" height="4" rx="2" fill="#dc2626"/>
  <text class="h" x="1136" y="644">Redis 8</text>
  <text class="t-dim" x="1136" y="666">An optimisation, never a dependency</text>
  <text class="t-dim" x="1136" y="686">Unreachable ⇒ every helper degrades</text>
  <text class="t-dim" x="1136" y="704">to a miss; readiness still passes</text>

  <!-- ══ SEED ═════════════════════════════════════════════════════════ -->
  <rect class="zone" x="40" y="450" width="584" height="284" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="60" y="476">ONE-SHOT JOB</text>

  <rect class="card" x="62" y="492" width="540" height="222" rx="8"/>
  <rect x="62" y="492" width="540" height="4" rx="2" fill="#ca8a04"/>
  <text class="h" x="80" y="522">Seed — <tspan class="mono" font-size="14">python -m src.seed</tspan></text>
  <text class="t" x="80" y="546">Runs to completion before the API starts, and refuses to run twice</text>
  <line x1="80" y1="562" x2="584" y2="562" stroke="#e2e8f0"/>
  <text class="t-dim" x="80" y="586">15 554 rows across 50 tables, built in memory and written in one transaction</text>
  <text class="t-dim" x="80" y="608">Ids come from the seeded stream, so a bookmark or a screenshot survives a reseed</text>
  <text class="t-dim" x="80" y="630">Timestamps are offsets from the run — a dataset seeded today looks like today</text>
  <text class="t-dim" x="80" y="652">Statuses drawn by weight, values deliberately missing, timestamps that follow status</text>
  <line x1="80" y1="668" x2="584" y2="668" stroke="#e2e8f0"/>
  <text class="t-dim" x="80" y="692">Five Keycloak personas seeded with the realm's emails — signing in adopts a full profile</text>

  <!-- ══ FLOW ARROWS ══════════════════════════════════════════════════ -->

  <!-- 1  browser → nginx : load the app -->
  <path class="flow" d="M310 232 H392" marker-end="url(#a1)"/>
  <circle cx="351" cy="212" r="11" fill="#5b5bd6"/>
  <text class="badge-t" x="351" y="216" text-anchor="middle">1</text>

  <!-- 2  nginx → api : meta/app -->
  <path class="flow" d="M602 268 H684" marker-end="url(#a1)"/>
  <circle cx="643" cy="248" r="11" fill="#5b5bd6"/>
  <text class="badge-t" x="643" y="252" text-anchor="middle">2</text>

  <!-- 3  browser → keycloak (over the top) -->
  <path class="flow-3" d="M186 168 V104 H1248 V166" marker-end="url(#a3)"/>
  <circle cx="717" cy="104" r="11" fill="#ca8a04"/>
  <text class="badge-t" x="717" y="108" text-anchor="middle">3</text>
  <text class="lbl" x="740" y="98">authorize — public URL, browser redirect</text>

  <!-- 4  keycloak → browser (token) -->
  <path class="flow-3" d="M1248 396 V424 H206 V396" marker-end="url(#a3)"/>
  <circle cx="717" cy="424" r="11" fill="#ca8a04"/>
  <text class="badge-t" x="717" y="428" text-anchor="middle">4</text>
  <text class="lbl" x="740" y="418">access token — role, email, audience</text>

  <!-- 5  browser → nginx → api, authenticated -->
  <path class="flow" d="M310 320 H360 V352 H392" marker-end="url(#a1)"/>
  <circle cx="351" cy="332" r="11" fill="#5b5bd6"/>
  <text class="badge-t" x="351" y="336" text-anchor="middle">5</text>
  <text class="lbl" x="228" y="410">Bearer token, same origin</text>

  <path class="flow" d="M602 360 H684" marker-end="url(#a1)"/>

  <!-- 6  api → keycloak : JWKS -->
  <path class="flow-3" d="M1038 292 H1116" marker-end="url(#a3)"/>
  <circle cx="1077" cy="272" r="11" fill="#ca8a04"/>
  <text class="badge-t" x="1077" y="276" text-anchor="middle">6</text>
  <text class="lbl" x="1044" y="322">JWKS — internal URL</text>

  <!-- 7  api → postgres -->
  <path class="flow-2" d="M1038 540 H1116" marker-end="url(#a2)"/>
  <circle cx="1077" cy="520" r="11" fill="#0891b2"/>
  <text class="badge-t" x="1077" y="524" text-anchor="middle">7</text>

  <!-- 8  api ⇢ redis (optional) -->
  <path class="flow-op" d="M1038 656 H1116" marker-end="url(#a4)"/>
  <circle cx="1077" cy="686" r="11" fill="#94a3b8"/>
  <text class="badge-t" x="1077" y="690" text-anchor="middle">8</text>

  <!-- 9  seed → postgres -->
  <path class="flow-2" d="M602 604 H648 V760 H1248 V722" marker-end="url(#a2)"/>
  <circle cx="900" cy="760" r="11" fill="#0891b2"/>
  <text class="badge-t" x="900" y="764" text-anchor="middle">9</text>

  <!-- ══ LEGEND ═══════════════════════════════════════════════════════ -->
  <rect class="zone" x="40" y="800" width="1360" height="140" rx="10" filter="url(#sh)"/>
  <text class="zone-lb" x="60" y="826">REQUEST FLOW</text>

  <g transform="translate(60 844)">
    <circle cx="10" cy="10" r="10" fill="#5b5bd6"/><text class="badge-t" x="10" y="14" text-anchor="middle">1</text>
    <text class="t" x="28" y="14">Browser loads the SPA from nginx</text>

    <circle cx="10" cy="42" r="10" fill="#5b5bd6"/><text class="badge-t" x="10" y="46" text-anchor="middle">2</text>
    <text class="t" x="28" y="46">SPA reads <tspan class="mono">/platform/meta/app</tspan> for the OIDC coordinates</text>

    <circle cx="10" cy="74" r="10" fill="#ca8a04"/><text class="badge-t" x="10" y="78" text-anchor="middle">3</text>
    <text class="t" x="28" y="78">Browser is redirected to Keycloak's <tspan font-weight="600">public</tspan> URL</text>
  </g>

  <g transform="translate(500 844)">
    <circle cx="10" cy="10" r="10" fill="#ca8a04"/><text class="badge-t" x="10" y="14" text-anchor="middle">4</text>
    <text class="t" x="28" y="14">Access token returned — role, email, audience</text>

    <circle cx="10" cy="42" r="10" fill="#5b5bd6"/><text class="badge-t" x="10" y="46" text-anchor="middle">5</text>
    <text class="t" x="28" y="46">API calls carry it, same origin, through nginx</text>

    <circle cx="10" cy="74" r="10" fill="#ca8a04"/><text class="badge-t" x="10" y="78" text-anchor="middle">6</text>
    <text class="t" x="28" y="78">Signature checked against JWKS over the <tspan font-weight="600">internal</tspan> URL</text>
  </g>

  <g transform="translate(960 844)">
    <circle cx="10" cy="10" r="10" fill="#0891b2"/><text class="badge-t" x="10" y="14" text-anchor="middle">7</text>
    <text class="t" x="28" y="14">Handler → core → SQLAlchemy → PostgreSQL</text>

    <circle cx="10" cy="42" r="10" fill="#94a3b8"/><text class="badge-t" x="10" y="46" text-anchor="middle">8</text>
    <text class="t" x="28" y="46">Read-through cache, optional — dashed for a reason</text>

    <circle cx="10" cy="74" r="10" fill="#0891b2"/><text class="badge-t" x="10" y="78" text-anchor="middle">9</text>
    <text class="t" x="28" y="78">Seed writes the demo dataset before the API starts</text>
  </g>
</svg>
