[project]
name = "horizon-docling"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "docling-slim[standard,format-iwork,format-opendocument,format-audio,format-video,format-xml-xbrl]==2.148.0",
  "torch>=2.9,<3", "torchvision>=0.24,<1", "torchaudio>=2.9,<3",
  "onnxruntime>=1.24,<2", "pandas>=2.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
