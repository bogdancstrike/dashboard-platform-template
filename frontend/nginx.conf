# Nucleus SPA, served by nginx, with the API on the same origin.
#
# Same-origin is the point. The bundle calls `/platform/...` relative, so the
# browser never issues a cross-origin request, there is no preflight on every
# call, and no API URL is compiled into the JavaScript. The same image runs in
# any environment; only NUCLEUS_API_UPSTREAM changes.
#
# Rendered by nginx's official entrypoint from /etc/nginx/templates. That
# entrypoint substitutes only names that exist in the environment, so nginx's
# own `$request_uri` and friends survive untouched.

# nginx resolves an upstream hostname *once, at startup*, when the name is
# written literally into proxy_pass — so a frontend that starts a moment before
# the API is in DNS exits with "host not found in upstream", and one whose API
# is later recreated keeps proxying to an address nothing answers on. Putting
# the host in a variable defers resolution to request time, which needs a
# resolver.
#
# Named explicitly rather than using the image's own NGINX_LOCAL_RESOLVERS: that
# is set by a sourced script *without* being exported, so the entrypoint's
# envsubst — which substitutes only exported names — leaves it as a literal and
# nginx then refuses to start. 127.0.0.11 is Docker's embedded DNS on every
# user-defined network.
resolver ${NUCLEUS_DNS_RESOLVER} valid=10s ipv6=off;

# The live notification channel (§17) is a WebSocket, and an upgrade only
# survives a proxy that forwards the two headers that request it. Without this
# the handshake comes back 200 with an HTML body, the browser reports a generic
# failure, and the client falls back to polling — working, but quietly a
# quarter as live as it looks. `Connection` has to be *close* for ordinary
# requests and *upgrade* for the handshake, which is what the map computes.
map $http_upgrade $nucleus_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads and exports pass through here; the API enforces its own limit.
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ── API ───────────────────────────────────────────────────────────────
    location /platform/ {
        set $nucleus_api ${NUCLEUS_API_UPSTREAM};
        proxy_pass http://$nucleus_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $nucleus_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for an export that has not yet been pushed to a job, and
        # for a live socket whose heartbeat is every 25 seconds.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Log streaming (§22) must not be buffered into uselessness.
        proxy_buffering off;
    }

    location = /swagger.json {
        set $nucleus_api_spec ${NUCLEUS_API_UPSTREAM};
        proxy_pass http://$nucleus_api_spec$request_uri;
        proxy_set_header Host $host;
    }

    # ── Static assets ─────────────────────────────────────────────────────
    # Hashed filenames, so they can be cached forever. index.html cannot be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # Every unmatched path is a client route (§69: a deep link has to work when
    # pasted, not only when navigated to).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
