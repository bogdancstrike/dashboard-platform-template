# Nucleus — the whole platform, from nothing to a working sign-in.
#
#     docker compose up
#
# Six services. The ordering constraints are the interesting part: the API
# waits for PostgreSQL *and* Keycloak to be **healthy**, not merely started —
# a container that is running is not a database that accepts connections, and
# depends_on without a condition only guarantees the former.
#
# The seed runs once, as a job, and refuses to run twice. `python -m src.seed`
# stops when it finds data, so `up` after a restart is a no-op rather than a
# second copy of the dataset.

name: nucleus

networks:
  nucleusnet:

volumes:
  postgres-data: {}
  redis-data: {}
  keycloak-data: {}
  storage-data: {}
  minio-data: {}

# Every backend process — api and seed — reads the same settings.
x-backend-env: &backend-env
  DATABASE_URL: "postgresql+psycopg2://platform:platform@postgres:5432/platform"
  REDIS_URL: "redis://redis:6379/0"
  CACHE_ENABLED: "${CACHE_ENABLED:-true}"
  # Two URLs, and the distinction is what makes OIDC work in Docker: keys are
  # FETCHED over the internal network, the issuer is VALIDATED against the
  # public address the browser actually used. Collapsing them breaks one or the
  # other.
  KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
  KEYCLOAK_PUBLIC_URL: "http://localhost:${KEYCLOAK_PORT:-8080}"
  KEYCLOAK_REALM: "template"
  KEYCLOAK_SPA_CLIENT_ID: "template-spa"
  KEYCLOAK_AUDIENCE: "template-api"
  ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5174},http://localhost:5174"
  API_PORT: "5101"
  API_PREFIX: "/platform"
  ENVIRONMENT: "${ENVIRONMENT:-local}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  SECRET_KEY: "${SECRET_KEY:-dev-only-change-me}"
  STORAGE_DIR: "/app/backend/var/storage"
  # Object storage (§20, §29, §30). Two endpoints, and the distinction is what
  # makes presigned URLs work in Docker: the API signs and reaches MinIO over
  # the compose network, and the *browser* follows the URL on an address that
  # exists outside it. A URL signed for `http://minio:9000` is one no browser
  # can resolve.
  STORAGE_ENDPOINT: "http://minio:9000"
  STORAGE_PUBLIC_ENDPOINT: "http://localhost:${MINIO_PORT:-9000}"
  STORAGE_BUCKET: "${STORAGE_BUCKET:-nucleus}"
  STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-nucleus}"
  STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-nucleus-dev-secret}"
  SEED_SCALE: "${SEED_SCALE:-full}"
  # AI (§41–46). The backend never holds the OpenAI key: it calls the LiteLLM
  # gateway with its own key, and the gateway holds the provider's. LLM_MODEL
  # names a LiteLLM model alias (deploy/litellm/config.yaml).
  LLM_BASE_URL: "http://litellm:4000/v1"
  LLM_API_KEY: "${LITELLM_MASTER_KEY:-}"
  LLM_MODEL: "${LLM_MODEL_ALIAS:-nucleus-chat}"
  LLM_EMBEDDING_MODEL: "nucleus-embed"
  LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-low}"
  # Document conversion for "Ask your documents" (§44): the isolated Docling
  # service below. Unreachable means uploads wait in FAILED with a reprocess
  # button, never that the API fails to start.
  DOCLING_URL: "http://docling:8080"
  SEED_RANDOM_SEED: "${SEED_RANDOM_SEED:-20260101}"

services:

  # ── PostgreSQL 18, with pgvector ─────────────────────────────────────────
  # The pgvector build of the official image (Debian): the same major version
  # and the same /var/lib/postgresql layout, plus the `vector` extension the
  # document search (§44) stores its embeddings in. A volume first created by
  # postgres:18-alpine starts as-is (the entrypoint re-owns it); its text
  # indexes were built under musl's collation and want one `REINDEX DATABASE`
  # under glibc's.
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nucleus-postgres
    networks: [nucleusnet]
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "platform"
      POSTGRES_PASSWORD: "platform"
      POSTGRES_DB: "platform"
    volumes:
      # PostgreSQL 18's image expects a single mount at /var/lib/postgresql and
      # puts the cluster in a version-named subdirectory beneath it, so that
      # `pg_upgrade --link` can work across a mount boundary. Mounting the older
      # /var/lib/postgresql/data path makes 18 refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ── LiteLLM — the AI gateway, and the only holder of the OpenAI key ─────
  # Keys come from `.env` (git-ignored; see .env.example). Without a key the
  # gateway still starts and the AI features say they are not configured.
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.108.0}
    container_name: nucleus-litellm
    networks: [nucleusnet]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-nucleus-dev-only}"
      LITELLM_LOG: ERROR
      LITELLM_TELEMETRY: "False"
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4001}:4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ── Docling — document conversion, CPU only, offline (§44) ─────────────
  # Adapted from Horizon's deploy/docling. It is sent bytes and answers with
  # sections that keep their pages and boxes; it holds no credentials, and its
  # models were downloaded at build time. The first build is large (~5 GB).
  docling:
    build: {context: ./deploy/docling}
    image: nucleus-docling:dev
    container_name: nucleus-docling
    networks: [nucleusnet]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1g"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DOCLING_CONCURRENCY: "${DOCLING_CONCURRENCY:-2}"
      DOCLING_DOCUMENT_TIMEOUT_S: "${DOCLING_DOCUMENT_TIMEOUT_S:-300}"
    ports:
      # Loopback only, so a backend run from the host (python main.py) can use it.
      - "127.0.0.1:${DOCLING_PORT:-8091}:8080"
    deploy:
      resources: {limits: {cpus: "${DOCLING_CPUS:-2}", memory: 4g}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  # ── Redis 8 — a cache, never a dependency ────────────────────────────────
  # `core/cache.py` degrades to a miss when this is unreachable, and readiness
  # does not fail on it. It is here to be exercised, not to be relied on.
  redis:
    image: redis:8-alpine
    container_name: nucleus-redis
    networks: [nucleusnet]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ── MinIO — object storage, so bytes never pass through the API ──────────
  #
  # The bucket is created by the API on boot (`storage.ensure_bucket`) rather
  # than by an init container: it is idempotent, it is one fewer service to
  # wait on, and a fresh volume then just works.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nucleus-minio
    networks: [nucleusnet]
    ports:
      # The API address, which the browser also follows presigned URLs on.
      - "${MINIO_PORT:-9000}:9000"
      # The console, for looking at what is in there.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-nucleus}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-nucleus-dev-secret}"
      # The browser uploads and downloads directly, so the bucket's own CORS
      # has to allow the app's origin — the API is not in the path to add it.
      # Every address the app is opened on: the dev server (5174), the built
      # SPA (8090, or FRONTEND_PORT), and their 127.0.0.1 twins. An origin
      # missing here is an upload the browser blocks before it is sent — the
      # client then falls back to sending the bytes through the API.
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5174},http://localhost:5174,http://localhost:8090,http://localhost:3000,http://127.0.0.1:5174,http://127.0.0.1:8090}"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ── Keycloak — identity, with the realm imported from the repo ───────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: nucleus-keycloak
    networks: [nucleusnet]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-template.json:/opt/keycloak/data/import/realm-template.json:ro
      # The Nucleus sign-in theme (glass card, Inter, light/dark). Mounted into
      # Keycloak's themes directory; start-dev serves it uncached, so edits show on reload.
      - ./keycloak/themes/nucleus:/opt/keycloak/themes/nucleus:ro
      - keycloak-data:/opt/keycloak/data
    # The image carries no curl or wget, so the probe is a bare TCP request.
    # It asks for the *realm*, not the root: Keycloak answers on the port
    # before the import has finished, and an API that starts then cannot
    # fetch signing keys.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/template HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ── One-shot: create the schema, then seed ───────────────────────────────
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nucleus-api
    container_name: nucleus-seed
    networks: [nucleusnet]
    working_dir: /app/backend
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      <<: *backend-env
      SERVICE_NAME: "nucleus-seed"
      CACHE_ENABLED: "false"
    # Refuses to run twice: it stops when it finds data. Pass --reset through
    # SEED_ARGS to rebuild, which is what `make reseed` does.
    command: ["sh", "-c", "python -m src.seed --scale $${SEED_SCALE} $${SEED_ARGS:-}"]
    restart: "no"

  # ── API — gunicorn with gevent workers ───────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nucleus-api
    container_name: nucleus-api
    networks: [nucleusnet]
    working_dir: /app/backend
    ports:
      - "${API_PORT:-5101}:5101"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      seed: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      SERVICE_NAME: "nucleus-api"
      # Four workers with small pools: measured at 1000 concurrent users
      # (docs/testing/performance.md, run C) — p95 1.1 s against 8.3 s with two
      # workers and the default 10+20 pool, at fewer total connections.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
    volumes:
      - storage-data:/app/backend/var/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5101/platform/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: ["gunicorn", "-k", "gevent", "-c", "gunicorn.conf.py", "wsgi:application"]
    restart: unless-stopped

  # ── Frontend — the built SPA, served by nginx on the API's origin ────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nucleus-frontend
    container_name: nucleus-frontend
    networks: [nucleusnet]
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      api: {condition: service_healthy}
    environment:
      NUCLEUS_API_UPSTREAM: "api:5101"
    restart: unless-stopped
