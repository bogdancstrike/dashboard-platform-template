# Nucleus sign-in: Keycloak's own v2 login (PatternFly 5) with the glass skin of
# the Nucleus app on top — the two-glow ground, a frosted card, Inter, pill
# fields and an accent pill button. Light and dark follow prefers-color-scheme.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/nucleus.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

darkMode=true
