# Alembic, configured for one thing: the schema this repository's models
# describe.
#
# There is deliberately **no URL here**. `migrations/env.py` reads
# `Config.DATABASE_URL`, which is the same value the application, the seed and
# the tests use — a URL in this file would be a second answer to "which
# database", and the one that is wrong is always the one somebody runs a
# migration against.

[alembic]
script_location = migrations
prepend_sys_path = .
# One path, and `os` says so explicitly — Alembic 1.19 deprecates guessing.
path_separator = os
# UTC, and sortable: `20260909_1412_add_widget_position` reads in order in a
# directory listing and in a diff, which a random hex slug does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
# None. A generated revision is reviewed by a person before it is committed,
# and a formatter that rewrites it between generation and review is one more
# thing to explain when the diff does not match what Alembic said it wrote.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
